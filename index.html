<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Zoho a Monday: el nuevo CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f5e6;--card:#fff;--ink:#00334e;--muted:#4b5f6b;--line:#e5e4df;--soft:#fff1b6;--teal:#00a3b8;--blue:#0078ba;--mid:#2a4e8f;--navy:#06235F;--orange:#eead5c;--deep:#00334e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,"Segoe UI",Arial,sans-serif;line-height:1.55}
header{background:#152645;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header span{font-weight:300;font-size:18px}
header b{font-weight:700;letter-spacing:.5px}
main{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px;font-weight:700}
.lead{margin:0 0 22px;color:var(--muted);font-weight:300;font-size:17px}
.stage{display:grid;grid-template-columns:1fr 300px 1fr;gap:18px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}
.pill{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:999px;padding:12px 18px 12px 12px;text-align:left;font:inherit;cursor:pointer;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s}
.pill:hover{transform:translateY(-2px)}
.pill:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pill[aria-expanded="true"]{outline:3px solid var(--ink);outline-offset:3px}
.pill .n{flex:0 0 40px;height:40px;border-radius:50%;background:#fff;color:#001a2c;display:grid;place-items:center;font-weight:900;font-size:18px}
.pill strong{display:block;font-size:15px;line-height:1.25}
.pill small{display:block;font-size:12.5px;opacity:.92;line-height:1.3;margin-top:2px}
.pill.dk{color:var(--deep)}
.ring{position:relative;width:300px;height:300px;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring path{cursor:pointer;transition:opacity .15s}
.ring path:hover{opacity:.8}
.ring path:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.hub{position:absolute;inset:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;padding:22px;font-weight:700;font-size:21px;line-height:1.2;box-shadow:0 0 0 1px var(--line)}
.hub em{display:block;font-style:normal;font-weight:300;font-size:14px;color:var(--muted);margin-top:8px}
#ov{position:fixed;inset:0;background:rgba(0,26,44,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
#ov[hidden]{display:none}
#detail{position:relative;width:100%;max-width:820px;max-height:100%;overflow:auto;background:var(--card);border-radius:18px;border-top:8px solid var(--teal);padding:26px 28px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#detail.open{animation:in .22s ease-out}
.x{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:#001a2c;font-size:22px;line-height:1;cursor:pointer}
.x:focus-visible,.nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;background:var(--deep);color:#fff;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#detail h2{margin:0 44px 8px 0;font-size:24px}
#detail p{margin:0 0 12px;max-width:72ch}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.g{background:var(--bg);border-radius:12px;padding:14px 16px}
.g h3{margin:0 0 6px;font-size:16px;color:var(--blue)}
.g p{margin:0 0 6px;font-size:15px}
.g ul{margin:0;padding-left:18px;font-size:15px}
.g li{margin:3px 0}
.flow{list-style:none;margin:16px 0;padding:0;counter-reset:step}
.flow li{position:relative;display:flex;align-items:flex-start;gap:12px;padding:4px 0 22px 0}
.flow li::before{counter-increment:step;content:counter(step);flex:0 0 30px;height:30px;border-radius:50%;background:var(--mid);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;z-index:1}
.flow li::after{content:"";position:absolute;left:14px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow li:last-child{padding-bottom:4px}
.flow .lbl{background:var(--bg);border-radius:10px;padding:8px 14px;font-size:14.5px;font-weight:700;flex:1}
.flow li.opt .lbl{background:transparent;border:2px dashed var(--orange);font-weight:400}
.flow li.opt::before{background:var(--orange);color:#001a2c}
.flow li.pre .lbl{background:transparent;border:2px solid var(--line);font-weight:400;font-style:italic}
.flow li.pre::before{content:"✓";background:var(--card);color:var(--muted);border:2px solid var(--line)}
.flow li.auto .lbl{border-left:4px solid var(--teal)}
.flow .tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px}
.flow li.opt .tag{background:var(--orange);color:#001a2c}
.flow li.auto .tag{background:var(--teal);color:#fff}
.flowkey{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:0 0 16px}
.flowkey span{display:inline-flex;align-items:center;gap:6px}
.flowkey i{width:12px;height:12px;border-radius:50%;display:inline-block}
.quote{background:var(--soft);border-left:5px solid var(--orange);border-radius:0 12px 12px 0;padding:12px 16px;font-weight:700;margin:14px 0 0}
.note{font-size:14px;color:var(--muted);font-style:italic;margin-top:12px}
.hint{text-align:center;color:var(--muted);margin-top:22px}
@media (max-width:860px){.stage{grid-template-columns:1fr}.ring{order:-1;width:240px;height:240px}.hub{inset:34px;font-size:17px;padding:14px}.hub em{font-size:12px}#detail{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><span>Infografía interactiva</span><b>TRIBU FYCO</b></header>
<main>
<h1>De Zoho a Monday: el nuevo CRM</h1>
<p class="lead">Haz clic en cada título para ver su detalle.</p>
<div class="stage">
  <div class="col" id="left"></div>
  <div class="ring"><svg viewBox="0 0 300 300" id="svg" role="group" aria-label="Secciones"></svg><div class="hub"><div>De Zoho a Monday: el nuevo CRM<em>Una nueva plataforma para conectar la operación</em></div></div></div>
  <div class="col" id="right"></div>
</div>
<p class="hint" id="hint">Selecciona un título para abrir su información.</p>
<div id="ov" hidden><section id="detail" role="dialog" aria-modal="true" aria-labelledby="dt"></section></div>
</main>
<script>
var C=["#eead5c","#00a3b8","#0078ba","#2a4e8f","#06235F","#00334e","#2a4e8f","#0078ba"];
var DK=[1,1,0,0,0,0,0,0];
var S=[
{t:"El cambio principal",s:"Zoho da paso a Monday",i:"La operación del CRM migra de Zoho a Monday, manteniendo como prioridad los procesos comerciales, logísticos y de seguimiento de la operación actual.",g:[{t:"En esta nueva etapa",l:["Monday es la plataforma para gestionar el CRM.","Se priorizan los procesos críticos de ventas, logística y seguimiento.","La información se organiza en módulos y tableros conectados.","Algunos desarrollos y funcionalidades se seguirán ajustando en una segunda etapa."]}],q:"Una nueva plataforma para conectar la operación del CRM."},
{t:"Qué cambia desde el lunes 21 de septiembre",s:"Todo se registra en Monday",i:"Desde el lunes 21 de septiembre, el CRM se gestiona en Monday.",g:[{t:"Dónde se registra",l:["Oportunidades, contactos y demás registros se crean en Monday, ya no en Zoho.","Lo que ya fue migrado se trabaja únicamente en Monday."]},{t:"Qué pasa con la información",l:["El acceso a Zoho se retiró para evitar seguir alimentándolo por costumbre.","La información no se elimina."]},{t:"Accesos",l:["Algunos usuarios tienen acceso solo de visualización.","Otros pueden actualizar información según su cargo.","Si no puedes ingresar, repórtalo al equipo responsable del CRM."]}],x:"Aún quedan funcionalidades por migrar en una segunda etapa.",q:"Desde el lunes 21 de septiembre, todo se registra en Monday."},
{t:"Un solo CRM, diferentes procesos",s:"Los módulos de Monday",i:"Monday organiza la información en módulos que se relacionan entre sí para gestionar el ciclo comercial y operativo.",g:[{t:"Gestión comercial",l:["Potenciales","Cuentas","Proveedores","Productos","Presupuestos","Cotizador comercial"]},{t:"Gestión de solicitudes",l:["Muestras","Requerimientos comerciales","Casos"]},{t:"Gestión logística",l:["CALDECO logístico"]},{t:"Seguimiento",l:["Seguimiento comercial"]},{t:"Tableros de consulta",p:"Muestras vistas y Casos vistas: solo visualización para el equipo administrativo, para relacionar el CRM con los gastos en SAP."}],q:"Los módulos se complementan para facilitar la trazabilidad de los procesos."},
{t:"El proceso se conecta de principio a fin",s:"Del potencial al seguimiento",i:"Los módulos no funcionan de manera aislada. La información se relaciona a medida que avanza el proceso comercial y operativo. Todo gira en torno al potencial.",f:[["Proveedor, cuenta y producto aprobados","pre"],["Se crea el potencial (desarrollo de oportunidad)",""],["Muestra / homologación","opt"],["Requerimiento comercial","opt"],["CALDECO logístico",""],["Cotizador comercial → Presupuesto",""],["Oferta global","auto"],["Negociación",""],["Oportunidad ganada o perdida",""],["Caso de postventa","opt"]],g:[{t:"Etapas del potencial",p:"Al generar la cotización, el potencial pasa solo a «oferta global». Después el soporte lo actualiza a negociación y luego a ganada o perdida."},{t:"Seguimiento comercial",p:"Se crea automáticamente con cada potencial. Antes lo llevaba solo Venezuela; ahora aplica para todas las sedes. Permite consolidar:",l:["Solicitud de muestra","Cotización del proveedor","CALDECO","Flujo de caja","Oferta al cliente","Solicitud de compra"]}],x:"Al marcar el proceso como hecho, el proyecto pasa automáticamente a proyecto finalizado.",q:"La trazabilidad permite consultar el avance del proyecto y la documentación de cada etapa."},
{t:"Cada usuario visualiza según su asignación",s:"Propietario, soporte y logística",i:"El acceso a la información está relacionado con los responsables definidos en cada proceso. Propietario, soporte y logística aparecen en todos los módulos.",g:[{t:"Propietario",p:"Comercial responsable del registro o proceso."},{t:"Soporte",p:"Suele crear los registros y asigna al comercial y al logístico."},{t:"Logística",p:"Lleva la negociación logística y las actividades asignadas."},{t:"Responsable de ingeniería",p:"Solo en requerimientos comerciales; lo asigna ingeniería al recibir la solicitud."},{t:"Equipo Suppliers",p:"Aprueba proveedores, cuentas, productos, muestras y casos."}],x:"Cada usuario ve solo lo que tiene asignado. En las tablas no se pueden agregar columnas; los formularios sí se pueden usar.",q:"No todos los usuarios visualizarán la misma información. El acceso depende del rol y de las asignaciones."},
{t:"Monday automatiza parte del seguimiento",s:"Aprobaciones y notificaciones",i:"Durante la demostración se revisaron notificaciones y automatizaciones relacionadas con el avance de los procesos.",g:[{t:"Aprobaciones",p:"Proveedores, cuentas, productos, muestras y casos quedan «por aprobar». Suppliers aprueba o escribe un motivo de rechazo, y el soporte recibe el aviso con lo que falta."},{t:"Cambios de estado",p:"Las actualizaciones de estado notifican a los responsables. El soporte también recibe un recordatorio periódico para actualizar la etapa del potencial."},{t:"Asignaciones",p:"Las notificaciones informan a la persona encargada de una actividad o proceso."},{t:"Ejemplo: CALDECO",p:"Al crearlo se avisa a logística. Cuando pasa a «verificación», se avisa al comercial y al soporte para revisar el precio."},{t:"Comentarios",p:"Puedes comentar en el tablero etiquetando con @. El comentario lo ve todo el tablero."}],x:"Solo el responsable de cada módulo (como muestras y casos) puede ajustar sus automatizaciones, y los cambios deben servir para todas las sedes, para mantener el proceso estandarizado.",q:"Las notificaciones acompañan el avance del proceso y facilitan el seguimiento."},
{t:"Puntos clave para la operación",s:"Telecable, SAP, CALDECO",i:"",g:[{t:"Telecable",l:["La cotización se realiza con el código de cliente, no con el código SAP.","Si un producto no tiene el código requerido, el sistema genera una alerta y no permite generar la cotización."]},{t:"SAP y Monday",l:["La gestión comercial se realiza en el CRM.","Los gastos se registran en SAP.","Los tableros espejo relacionan el CRM con los gastos de SAP."]},{t:"CALDECO",l:["El soporte agrega producto, proveedor, cantidad, costo unitario y medida CBM; logística completa el resto y el precio.","Estados: pendiente, verificación, validado y ejecutado o cancelado.","El flujo llega hasta el flete internacional. Aduanas, impuestos y aranceles serán una etapa posterior."]},{t:"Asistente de IA de Monday",p:"Habrá créditos mensuales por departamento para consultas y apoyo con tableros y automatizaciones. Aún no están asignados."}],q:"La herramienta continuará evolucionando mediante ajustes y nuevos desarrollos."},
{t:"Una operación más conectada",s:"Cierre",i:"La migración reúne en Monday los principales procesos del CRM y conecta la información desde la oportunidad comercial hasta el seguimiento del proyecto. La plataforma es la base de esta nueva etapa, mientras continúan los ajustes y desarrollos previstos.",g:[],x:"Conocer la conexión entre los módulos, las asignaciones y los flujos de trabajo facilita el uso de Monday y contribuye a una gestión más organizada de la información.",q:"¡Juntos en esta nueva etapa!"}
];
var pos=[240,200,160,120,-60,-20,20,60],wid=[36,36,36,36,36,36,36,36];
var C0=0;
var NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg"),det=document.getElementById("detail"),cur=-1,pills=[],arcs=[];
function pt(r,a){a=a*Math.PI/180;return[150+r*Math.cos(a),150+r*Math.sin(a)]}
function arc(a0,a1){var o0=pt(148,a0),o1=pt(148,a1),i1=pt(96,a1),i0=pt(96,a0);return"M"+o0+"A148 148 0 0 1 "+o1+"L"+i1+"A96 96 0 0 0 "+i0+"Z"}
function esc(s){return s}
S.forEach(function(d,k){
  var b=document.createElement("button");b.className="pill"+(DK[k]?" dk":"");b.style.background=C[k];b.setAttribute("aria-expanded","false");b.setAttribute("aria-controls","detail");
  b.innerHTML='<span class="n">'+(k+1)+'</span><span><strong>'+d.t+'</strong><small>'+d.s+'</small></span>';
  b.onclick=function(){pick(k)};pills.push(b);document.getElementById(k<4?"left":"right").appendChild(b);
  var p=document.createElementNS(NS,"path");p.setAttribute("d",arc(pos[k]-wid[k]/2,pos[k]+wid[k]/2));p.setAttribute("fill",C[k]);p.setAttribute("tabindex","0");p.setAttribute("role","button");p.setAttribute("aria-label",d.t);
  p.onclick=function(){pick(k)};p.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(k)}};svg.appendChild(p);arcs.push(p);
});
function closeD(){document.getElementById("ov").hidden=true;document.body.style.overflow="";pills.forEach(function(b){b.setAttribute("aria-expanded","false")});if(cur>-1)pills[cur].focus();cur=-1}
function pick(k){
  var d=S[k],h='<button class="x" aria-label="Cerrar" id="cx">×</button><h2 id="dt">'+(k+1)+'. '+d.t+'</h2>';
  if(d.i)h+='<p>'+d.i+'</p>';
  if(d.f){h+='<div class="flowkey"><span><i style="background:var(--mid)"></i>Paso del flujo</span><span><i style="background:var(--card);border:2px solid var(--line)"></i>Requisito previo</span><span><i style="background:var(--orange)"></i>Si aplica</span><span><i style="background:var(--teal)"></i>Automático</span></div>';
  h+='<ol class="flow">'+d.f.map(function(x){var cls=x[1],tag=cls==="opt"?'<span class="tag">Si aplica</span>':cls==="auto"?'<span class="tag">Automático</span>':cls==="pre"?'<span class="tag">Requisito</span>':'';return'<li class="'+cls+'"><span class="lbl">'+x[0]+tag+'</span></li>'}).join("")+'</ol>';}
  if(d.g.length)h+='<div class="groups">'+d.g.map(function(g){return'<div class="g"><h3>'+g.t+'</h3>'+(g.p?'<p>'+g.p+'</p>':'')+(g.l?'<ul>'+g.l.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul>':'')+'</div>'}).join("")+'</div>';
  if(d.x)h+='<p class="'+(k===5?'note':'')+'">'+d.x+'</p>';
  if(d.q)h+='<div class="quote">'+d.q+'</div>';
  h+='<div class="nav"><button id="pv"'+(k===0?' disabled':'')+'>Anterior</button><button id="nx"'+(k===7?' disabled':'')+'>Siguiente</button></div>';
  det.innerHTML=h;det.style.borderTopColor=C[k];det.scrollTop=0;
  var wasOpen=cur>-1;cur=k;
  document.getElementById("ov").hidden=false;document.body.style.overflow="hidden";
  det.classList.remove("open");void det.offsetWidth;det.classList.add("open");
  pills.forEach(function(b,n){b.setAttribute("aria-expanded",n===k?"true":"false")});
  document.getElementById("cx").onclick=closeD;
  document.getElementById("pv").onclick=function(){pick(k-1)};
  document.getElementById("nx").onclick=function(){pick(k+1)};
  document.getElementById("cx").focus();
}
document.getElementById("ov").onclick=function(e){if(e.target===this)closeD()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur>-1)closeD()});
</script>
</body>
</html>
